icons_format = "{icon}"

[icons]
icons = "material-nf"

[theme]
theme = "srcery"
[theme.overrides]
idle_bg = "#4E3747"
warning_bg = "#4E3747"
critical_bg = "#4E3747"
info_bg = "#4E3747"
good_bg = "#4E3747"

[[block]]
block = "battery"

[[block]]
block = "cpu"

[[block]]
block = "memory"
format = " $icon $mem_used_percents.eng(w:1) "
interval = 30

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
